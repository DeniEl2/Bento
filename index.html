<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/free-icon-gallery-5369300.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bento-Галерея</title>
</head>
<body>
<main class="header">
    <div class="left_conteiner">
        <div class="top">
            <h1>Откройте <br>природу</h1>
            <p class="text">Просматривайте места отобранные фотографами со всего мира. Иследуйте <br>горы, леса, пляжа и города.</p>
        </div>
        <div class="bottom">
            <button class="btn">Горы</button>
            <button class="btn">Океан</button>
            <button class="btn">Лес</button>
            <button class="btn">Города</button>
            <button class="btn">Пустыня</button>
        </div>
    </div>
    <div class="right_conteiner">
        <div class="conteiner_grid">
            <img src="img/gora.jpg" alt="Альпы" class="img_photo images1">
            <img src="img/океан.jpg" alt="Океан" class="img_photo">
            <img src="img/les.jpg" alt="Лес" class="img_photo gg"> 
            <img src="img/tocio.jpg" alt="Токио" class="img_photo">
            <img src="img/pl.jpg" alt="Пляж" class="img_photo gg">
            <img src="img/123.jpg" alt="Река" class="img_photo images1 gg1">
            <img src="img/213.jpg" alt="Пустыня" class="img_photo images1">
            <img src="img/sneg.jpg" alt="Снег" class="img_photo images1">
        </div>
    </div>
</main>
</body>
</html>
